name: Daily noon update

on:
  schedule:
    # 北京时间每天 12:00 = UTC 04:00
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Scrape and rebuild
        run: python scripts/update.py

      - name: Commit if changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: 正午更新江苏浙江测试岗"
          file_pattern: "jobs.json index.html README.md meta.json candidate_jobs.json data/"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
