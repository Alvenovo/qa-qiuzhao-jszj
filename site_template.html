<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>2027秋招 · 江苏浙江测试岗</title>
  <meta name="description" content="江苏、浙江软件测试 / 测试开发岗位，每日中午12点更新，只展示仍在招的信息。" />
  <style>
    :root{
      --paper:#fbfaf5; --ink:#161513; --grey:#8a887f; --faint:#c9c7bd;
      --seal:#d23b2e; --wash:#f1efe8; --ok:#2c6e49;
    }
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:var(--paper);color:var(--ink);
      font-family:-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
      -webkit-font-smoothing:antialiased}
    header{position:sticky;top:0;z-index:50;background:rgba(251,250,245,.95);
      backdrop-filter:blur(10px);border-bottom:2px solid var(--ink)}
    .head-in{max-width:920px;margin:0 auto;padding:16px 20px 12px}
    h1{font-size:1.85rem;font-weight:800;letter-spacing:.04em;line-height:1.15}
    .sub{color:var(--grey);font-size:.82rem;font-weight:600;margin-top:8px;line-height:1.6}
    .sub b{color:var(--ink)}
    .controls{display:flex;gap:10px;margin-top:14px;align-items:center;flex-wrap:wrap}
    .seg{display:flex;gap:0}
    .seg button{border:2px solid var(--ink);background:var(--paper);padding:7px 12px;
      font-size:.8rem;font-weight:700;color:var(--ink);cursor:pointer;margin-left:-2px}
    .seg button:first-child{margin-left:0;border-radius:255px 0 0 15px / 15px 0 0 255px}
    .seg button:last-child{border-radius:0 15px 225px 0 / 0 225px 15px 0}
    .seg button.on{background:var(--ink);color:var(--paper)}
    .search{border:2px solid var(--ink);background:#fff;border-radius:99px;
      padding:7px 14px;font-size:.85rem;min-width:180px;flex:1;max-width:280px}
    .chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 8px;scrollbar-width:none}
    .chip{flex:none;background:var(--paper);color:var(--ink);border:2px solid var(--ink);
      border-radius:99px;padding:5px 13px;font-size:.78rem;font-weight:700;cursor:pointer}
    .chip.on{background:var(--ink);color:var(--paper)}
    main{max-width:920px;margin:0 auto;padding:22px 20px 60px}
    .hint{font-size:.78rem;color:var(--grey);font-weight:600;margin-bottom:16px}
    .list{display:flex;flex-direction:column;gap:14px}
    .card{display:block;text-decoration:none;color:inherit;background:#fff;
      padding:16px 18px;border:2px solid var(--ink);
      border-radius:255px 15px 225px 15px / 15px 225px 15px 255px}
    .card:nth-child(even){border-radius:15px 225px 15px 255px / 255px 15px 225px 15px}
    .card:hover{transform:translateY(-2px);box-shadow:5px 5px 0 var(--ink)}
    .c-top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
    .c-name{font-size:1.12rem;font-weight:800}
    .c-prog{font-size:.82rem;font-weight:700;color:var(--grey)}
    .c-badges{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
    .pill{font-size:.7rem;font-weight:800;padding:3px 9px;border:2px solid var(--ink);
      border-radius:99px;white-space:nowrap}
    .pill.days{border-color:var(--seal);color:var(--seal)}
    .pill.hot{background:var(--seal);border-color:var(--seal);color:#fff}
    .pill.src{background:var(--wash)}
    .c-mid{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}
    .tag{font-size:.73rem;font-weight:600;border:1.5px solid var(--faint);
      border-radius:6px 10px 7px 11px;padding:2px 8px;background:var(--paper)}
    .tag.ind{border-color:var(--ink)}
    .c-dates{margin-top:10px;display:flex;gap:16px;flex-wrap:wrap;
      font-size:.8rem;font-weight:600;color:var(--grey)}
    .c-dates b{color:var(--ink)}
    .c-bot{display:flex;align-items:center;gap:10px;margin-top:10px;
      font-size:.8rem;color:var(--grey);font-weight:600}
    .c-go{margin-left:auto;color:var(--ink);font-weight:800;font-size:.82rem}
    .c-go.muted{color:var(--grey);font-weight:600}
    .empty{text-align:center;color:var(--grey);padding:70px 0;font-weight:600}
    footer{max-width:920px;margin:0 auto;padding:20px 20px 44px;color:var(--grey);
      font-size:.76rem;line-height:1.8;border-top:2px solid var(--ink)}
    @media(max-width:560px){h1{font-size:1.4rem}.c-badges{margin-left:0;width:100%}}
  </style>
</head>
<body>
  <header>
    <div class="head-in">
      <h1>秋招测试岗 · 江苏浙江</h1>
      <p class="sub" id="stats">正在载入…</p>
      <div class="controls">
        <div class="seg" id="province">
          <button class="on" data-p="全部">全部地区</button>
          <button data-p="江苏">江苏</button>
          <button data-p="浙江">浙江</button>
        </div>
        <div class="seg" id="sort">
          <button class="on" data-s="deadline-asc">截止时间↑</button>
          <button data-s="deadline-desc">截止时间↓</button>
          <button data-s="updated-desc">更新时间↓</button>
          <button data-s="updated-asc">更新时间↑</button>
        </div>
        <input class="search" id="q" placeholder="搜公司 / 岗位" />
      </div>
      <div class="chips" id="roles"></div>
    </div>
  </header>
  <main>
    <p class="hint">只展示尚未截止的软件测试、测试开发、质量保障等岗位。日期以企业官网为准。</p>
    <div class="list" id="list"></div>
  </main>
  <footer>
    数据由公开招聘信息每日中午 12 点（北京时间）自动聚合，来源含企业校招官网、校招日历、牛客等。
    Boss / 智联等需登录的渠道不会出现在 GitHub 自动更新里。投递前请再确认官网。
  </footer>
  <script>
    const JOBS = __JOBS__;
    const META = __META__;
    const ROLES = ["全部", "软件测试", "测试开发", "质量保障", "自动化测试"];
    let province = "全部", role = "全部", sort = "deadline-asc", q = "";

    const $ = s => document.querySelector(s);
    const today = new Date(new Date().toLocaleString("en-US", {timeZone: "Asia/Shanghai"}));
    const todayStr = today.toISOString().slice(0,10);

    function daysLeft(d){
      if(!d) return null;
      return Math.round((new Date(d) - new Date(todayStr)) / 864e5);
    }
    function fmt(d, fallback){ return d || fallback; }

    $("#roles").innerHTML = ROLES.map((r,i)=>
      `<button class="chip${i===0?" on":""}" data-r="${r}">${r}</button>`
    ).join("");

    function filtered(){
      const kw = q.trim();
      let list = JOBS.filter(j => {
        if (province !== "全部" && !(j.provinces||[]).includes(province)) return false;
        if (role !== "全部" && j.role_type !== role) return false;
        if (kw){
          const blob = [j.company, j.program, ...(j.positions||[]), ...(j.locations||[])].join(" ");
          if (!blob.includes(kw)) return false;
        }
        return true;
      });
      const [field, dir] = sort.split("-");
      const key = field === "updated" ? "updated_at" : "deadline";
      list.sort((a,b)=>{
        const av = a[key] || (dir==="asc" ? "9999" : "0000");
        const bv = b[key] || (dir==="asc" ? "9999" : "0000");
        if (av === bv) return a.company.localeCompare(b.company, "zh");
        return dir==="asc" ? (av<bv?-1:1) : (av>bv?-1:1);
      });
      return list;
    }

    function card(j){
      const dl = daysLeft(j.deadline);
      const days = dl===null ? `<span class="pill">招满即止</span>` :
        `<span class="pill days${dl<=7?" hot":""}">${dl===0?"今天截止":"剩 "+dl+" 天"}</span>`;
      const url = j.apply_url;
      const open = url ? `href="${url}" target="_blank" rel="noopener"` : "";
      const tag = url ? "a" : "div";
      return `<${tag} class="card" ${open}>
        <div class="c-top">
          <div class="c-name">${j.company}</div>
          ${j.program?`<div class="c-prog">${j.program}</div>`:""}
          <div class="c-badges">${days}<span class="pill src">${j.source}</span></div>
        </div>
        <div class="c-mid">
          <span class="tag ind">${j.role_type}</span>
          <span class="tag">${j.cohort||""} ${j.batch||""}</span>
          ${(j.positions||[]).slice(0,4).map(p=>`<span class="tag">${p}</span>`).join("")}
        </div>
        <div class="c-dates">
          <span>开始 <b>${fmt(j.start_date,"以官网为准")}</b></span>
          <span>截止 <b>${fmt(j.deadline,"招满即止")}</b></span>
          <span>更新 <b>${fmt(j.updated_at,"—")}</b></span>
        </div>
        <div class="c-bot">
          <span>${(j.locations||[]).join(" · ")} · ${(j.provinces||[]).join("/")}</span>
          <span class="c-go${url?"":" muted"}">${url?"去官网投递 →":"请搜官方渠道"}</span>
        </div>
      </${tag}>`;
    }

    function render(){
      const list = filtered();
      $("#list").innerHTML = list.length ? list.map(card).join("") :
        `<div class="empty">没有符合筛选的在招岗位，换个条件试试</div>`;
      const n = JOBS.length;
      const js = JOBS.filter(j=>(j.provinces||[]).includes("江苏")).length;
      const zj = JOBS.filter(j=>(j.provinces||[]).includes("浙江")).length;
      $("#stats").innerHTML =
        `共 <b>${n}</b> 条在招测试岗 · 江苏 ${js} · 浙江 ${zj} · 更新于 <b>${META.updated_at||"—"}</b><br>` +
        `数据源：${(META.sources||[]).join("、")||"本地精选"}`;
    }

    $("#province").addEventListener("click", e=>{
      const b=e.target.closest("button"); if(!b) return;
      province=b.dataset.p;
      [...$("#province").children].forEach(x=>x.classList.toggle("on",x===b));
      render();
    });
    $("#sort").addEventListener("click", e=>{
      const b=e.target.closest("button"); if(!b) return;
      sort=b.dataset.s;
      [...$("#sort").children].forEach(x=>x.classList.toggle("on",x===b));
      render();
    });
    $("#roles").addEventListener("click", e=>{
      const b=e.target.closest(".chip"); if(!b) return;
      role=b.dataset.r;
      [...$("#roles").children].forEach(x=>x.classList.toggle("on",x===b));
      render();
    });
    $("#q").addEventListener("input", e=>{ q=e.target.value; render(); });
    render();
  </script>
</body>
</html>
